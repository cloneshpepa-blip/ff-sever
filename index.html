<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Custom Server Status</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 24px;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 18px; color: #38bdf8; text-align: center; margin-bottom: 16px; }
        .status-box {
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
        }
        .online { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 FF Custom Server</h1>
        <div class="status-box">
            Trạng thái: <span class="online">Đang hoạt động (Online)</span>
        </div>
        <div class="status-box" id="api-data">
            Đang kết nối API...
        </div>
    </div>

    <script>
        fetch('https://ff-sever.vercel.app/api/update')
            .then(res => res.json())
            .then(data => {
                document.getElementById('api-data').innerHTML = 
                    `API phản hồi: <b style="color:#4ade80">Thành công</b><br>Mã Code: ${data.code}`;
            })
            .catch(err => {
                document.getElementById('api-data').innerText = 'Lỗi kết nối API endpoint!';
            });
    </script>
</body>
</html>
