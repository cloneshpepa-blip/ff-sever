<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk Velocity 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HUD Overlay -->
    <div id="hud-container">
        <div class="hud-card">
            <div class="hud-title">Pilot</div>
            <div class="hud-value" id="pilot-name">Connecting...</div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Health</div>
            <div class="bar-background"><div id="health-bar"></div></div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Boost</div>
            <div class="bar-background"><div id="boost-bar"></div></div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Score</div>
            <div class="hud-value" id="score-val">0</div>
        </div>
    </div>

    <!-- Controls Layer -->
    <div id="controls-layer">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-boost">⚡</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <!-- Game Over Screen -->
    <div id="overlay">
        <div class="modal">
            <h1>SYSTEM CRASH</h1>
            <p id="death-reason" style="color: #94a3b8; font-size: 14px;"></p>
            <h2 id="final-score" style="color: #00f3ff; margin: 16px 0;">0 PTS</h2>
            <button id="btn-restart">REBOOT SYSTEM</button>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Main Game Logic -->
    <script src="game.js"></script>
</body>
</html>
